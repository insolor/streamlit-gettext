name: Draft Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Stay at least one minor version behind the latest Python release,
          # and choose a version that is not nearing end of support.
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Build project
        id: build
        run: |
          uv build
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          tag_name: ${{ steps.build.outputs.version }}
          draft: true
