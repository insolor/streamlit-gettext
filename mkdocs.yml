site_name: streamlit-gettext documentaton
site_url: https://insolor.github.io/streamlit-gettext/
repo_url: https://github.com/insolor/streamlit-gettext/
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - content.action.edit
  palette:
    primary: black

plugins:
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - build: true
          default: true
          locale: en
          name: English
        - build: true
          default: false
          locale: ru
          name: Русский
        - build: true
          default: false
          locale: uk
          name: Українська
        - build: true
          default: false
          locale: pl
          name: Polski
        - build: true
          default: false
          locale: es
          name: Español
        - build: true
          default: false
          locale: pt-BR
          name: Português (Brasil)
        - build: true
          default: false
          locale: zh
          name: 简体中文
        - build: true
          default: false
          locale: zh-TW
          name: 繁體中文
      reconfigure_material: true
      reconfigure_search: true
  - git-revision-date-localized:
      enabled: true
  - mkdocstrings

nav:
  - index.md
  - translation_workflow.md
  - api.md
