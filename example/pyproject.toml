[project]
name = "example"
version = "0.1.0"
description = "streamlit-gettext usage example"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.64.0",
    "streamlit-gettext",
]

[tool.uv.sources]
streamlit-gettext = { path = "../", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.poe.tasks]
# Run the application
run = "streamlit run autodetect_example.py"

# Create pot file
xgettext.shell = "xgettext -d messages -o ./locale/messages.pot *.py --from-code=UTF-8 --no-location"

# Compile all po files to mo format
msgfmt = "find ./locale -name \\*.po -execdir msgfmt messages.po -o messages.mo \\;"

# Update all po files from mo file
msgmerge.shell = "find locale -name '*.po' -exec msgmerge -U {} locale/messages.pot \\; && find locale -name '*.po~' -delete"
